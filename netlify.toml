# Netlify Configuration for cargotopakistan.ae

[build]
  command = "npm run build"
  publish = "dist"

# 1. PRIMARY REDIRECTS (System Files)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# 2. SEO & SPA REDIRECT
# Industry-standard fallback for Vite/React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. GLOBAL HEADERS & FRESHNESS CONTROL
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Added 'unsafe-eval' to ensure GTM runs smoothly for Google Ads.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https: /.netlify/images/ https://www.googletagmanager.com https://www.googleadservices.com https://stats.g.doubleclick.net https://www.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co https://www.googletagmanager.com https://www.googleadservices.com https://*.google.com https://*.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https: https://www.googletagmanager.com https://www.googleadservices.com https://*.google.com https://*.doubleclick.net;"
    # NEW BEST PRACTICE: Prevents the "Broken Site" issue for Google Ads traffic.
    # Forces browser to verify the version with Netlify before using old cache.
    Cache-Control = "public, max-age=0, must-revalidate"

# 4. PERFORMANCE: Long-Term Cache for Immutable Assets
# Vite generates unique hash names (like index-A1B2.js), so these never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 5. IMAGES: Faster Loading, Rapid Updates
[[headers]]
  for = "/images/*"
  [headers.values]
    # Set to 1 year but with revalidate to ensure updates are seen.
    Cache-Control = "public, max-age=31536000, must-revalidate"

# 6. SEO: Sitemap & Robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"