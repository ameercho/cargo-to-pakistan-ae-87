# Netlify Configuration for cargotopakistan.ae (Astro static build)

[build]
  command = "npm run build"
  publish = "dist"

# 1. LEGACY URL REDIRECTS (real 301s, preserving Google Ads Quality Score /
#    Search Console history built up on these exact paths on the old site)
[[redirects]]
  from = "/karachi-cargo"
  to = "/pakistan-cargo-to-karachi/"
  status = 301

[[redirects]]
  from = "/lahore-cargo"
  to = "/pakistan-cargo-to-lahore/"
  status = 301

[[redirects]]
  from = "/islamabad-cargo"
  to = "/pakistan-cargo-to-islamabad/"
  status = 301

[[redirects]]
  from = "/peshawar-cargo"
  to = "/pakistan-cargo-to-peshawar/"
  status = 301

# Orphaned "-cargo" slugs that had real SEO metadata written for them in the
# old site's seo-config.js but were never wired to a live route. Redirecting
# rather than dropping in case any were indexed/crawled via the sitemap.
