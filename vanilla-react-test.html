<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla React Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            background: rgba(0,0,0,0.1);
            padding: 40px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="vanilla-root">
        <div class="container">
            <h1>🔄 Loading Vanilla React Test...</h1>
            <p>Testing React without any bundling...</p>
        </div>
    </div>

    <!-- Load React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script>
        console.log('🧪 Vanilla React Test Starting...');
        console.log('React object:', window.React);
        console.log('ReactDOM object:', window.ReactDOM);
        
        if (!window.React) {
            console.error('❌ React not loaded from CDN');
            document.getElementById('vanilla-root').innerHTML = '<h1>❌ React failed to load from CDN</h1>';
        } else if (!window.ReactDOM) {
            console.error('❌ ReactDOM not loaded from CDN');
            document.getElementById('vanilla-root').innerHTML = '<h1>❌ ReactDOM failed to load from CDN</h1>';
        } else {
            console.log('✅ React and ReactDOM loaded successfully');
            
            // Create a simple React component
            const TestComponent = () => {
                return React.createElement('div', { className: 'container' }, [
                    React.createElement('h1', { key: '1', style: { color: '#4CAF50' } }, '🎉 VANILLA REACT WORKS!'),
                    React.createElement('p', { key: '2' }, 'React is working perfectly without bundling!'),
                    React.createElement('p', { key: '3', style: { fontSize: '14px', opacity: 0.8 } }, `Loaded at: ${new Date().toLocaleTimeString()}`),
                    React.createElement('p', { key: '4', style: { fontSize: '12px', marginTop: '20px' } }, 'This proves React itself is not the problem.')
                ]);
            };
            
            // Render the component
            try {
                const root = ReactDOM.createRoot(document.getElementById('vanilla-root'));
                root.render(React.createElement(TestComponent));
                console.log('✅ Vanilla React component rendered successfully!');
            } catch (error) {
                console.error('❌ Error rendering vanilla React:', error);
                document.getElementById('vanilla-root').innerHTML = `<h1>❌ Error: ${error.message}</h1>`;
            }
        }
    </script>
</body>
</html>
